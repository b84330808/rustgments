# Build abi3 wheels (one per platform, Python >= 3.9) and an sdist, test every
# wheel against Pygments on the supported Pythons, and on a v* tag publish to
# PyPI (trusted publishing) and attach the files to a GitHub release.
name: wheels

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: linux-x86_64-manylinux, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: '2_28' }
          - { name: linux-aarch64-manylinux, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: '2_28' }
          - { name: linux-x86_64-musllinux, os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: linux-aarch64-musllinux, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # The abi3 wheel must select the right table variant on every interpreter
  # and match Pygments there (glibc/macOS/Windows; musl wheels are only built).
  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        exclude:
          # macOS runners are slow to come by: oldest and newest are enough.
          - { os: macos-15-intel, python: '3.10' }
          - { os: macos-15-intel, python: '3.11' }
          - { os: macos-15-intel, python: '3.12' }
          - { os: macos-15-intel, python: '3.13' }
          - { os: macos-15, python: '3.10' }
          - { os: macos-15, python: '3.11' }
          - { os: macos-15, python: '3.12' }
          - { os: macos-15, python: '3.13' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Install the wheel for this platform
        shell: bash
        run: |
          python -m pip install pygments==2.21.0
          python -m pip install --no-index --find-links dist rustgments
      - name: API and drop-in smoke test
        shell: bash
        run: |
          python -I -c "import rustgments as r, sys; assert r._VERSION_OK, r._INFO; print(sys.version, r._INFO['variant_pythons'], r._INFO['unicode_version'])"
          python -I tests/test_api.py
      - name: Token and HTML parity on Pygments' own test inputs
        shell: bash
        run: |
          git clone -q --depth 1 -b 2.21.0 https://github.com/pygments/pygments corpus-pygments
          python -I tests/parity.py examplefiles --pygments-src corpus-pygments
          python -I tests/parity.py snippets --pygments-src corpus-pygments
      - name: Parity gate for every native lexer
        shell: bash
        run: |
          python -I tests/gate.py run gate.json --mutants 5 --pygments-src corpus-pygments
          python -I -c "import json; l=json.load(open('gate.json',encoding='utf-8'))['lexers']; bad={k:v for k,v in l.items() if not v['verdict'].startswith('tables:') and v['verdict']!='pass'}; print(len(l),'lexers, failures:',bad); assert not bad"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sdist, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing
      contents: write   # GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
